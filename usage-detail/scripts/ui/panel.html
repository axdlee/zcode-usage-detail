<!doctype html>
<!-- ZCode 用量明细 · 会话侧栏面板（全功能版）。零依赖：window.zcode 兼容层取数，明暗主题自适应 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>用量面板</title>
<style>
:root{
  --background:#ffffff; --foreground:#1a1a1a; --card:#ffffff;
  --muted:#f4f4f5; --muted-foreground:#71717a; --border:#e4e4e7;
  --green:#16a34a; --red:#dc2626; --yellow:#d97706; --series:#4066f0; --series-2:#e8890c;
}
@media (prefers-color-scheme: dark){
  :root{
    --background:#1b1b1f; --foreground:#e9e9ec; --card:#232328;
    --muted:#2c2c31; --muted-foreground:#9c9ca6; --border:#38383f;
    --green:#3fbf7f; --red:#f47166; --yellow:#d9a514; --series:#6c8cff; --series-2:#e8a15c;
  }
}
:root[data-theme="dark"]{--background:#1b1b1f;--foreground:#e9e9ec;--card:#232328;--muted:#2c2c31;--muted-foreground:#9c9ca6;--border:#38383f;--green:#3fbf7f;--red:#f47166;--yellow:#d9a514;--series:#6c8cff;--series-2:#e8a15c}
:root[data-theme="light"]{--background:#ffffff;--foreground:#1a1a1a;--card:#ffffff;--muted:#f4f4f5;--muted-foreground:#71717a;--border:#e4e4e7;--green:#16a34a;--red:#dc2626;--yellow:#d97706;--series:#4066f0;--series-2:#e8890c}
*{box-sizing:border-box}
body{margin:0;padding:10px 10px 18px;background:var(--background);color:var(--foreground);font:12px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.card{border:1px solid var(--border);border-radius:10px;padding:10px 11px;margin:0 0 8px;background:var(--card)}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hd b{font-size:12px;font-weight:600;letter-spacing:.2px}
.hd .sub{font-size:10px;color:var(--muted-foreground);font-weight:400;margin-left:6px}
.act{font-size:11px;color:var(--muted-foreground);cursor:pointer;border:1px solid var(--border);background:none;padding:2px 8px;border-radius:6px;line-height:1.5}
.act:hover{color:var(--foreground);border-color:var(--muted-foreground)}
.act.primary{color:var(--background);background:var(--foreground);border-color:var(--foreground)}
.more{display:block;text-align:right;font-size:10px;color:var(--muted-foreground);text-decoration:none;margin-top:6px}
.more:hover{color:var(--foreground)}
/* tab 栏 */
.tabs{display:flex;gap:2px;background:var(--muted);border-radius:8px;padding:2px;margin-bottom:10px}
.tabs button{flex:1;border:0;background:none;color:var(--muted-foreground);font:inherit;font-size:11px;padding:4px 0;border-radius:6px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--foreground);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kpi .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.kpi .l{font-size:10px;color:var(--muted-foreground);margin-top:1px}
.kpi .badge{display:inline-block;font-size:9px;padding:0 4px;border-radius:4px;margin-left:4px;vertical-align:2px}
.row{display:flex;align-items:center;gap:7px;margin:4px 0;font-size:11px}
.row .nm{flex:0 0 36%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted-foreground)}
.row .bar{flex:1;height:4px;border-radius:2px;background:var(--muted);overflow:hidden}
.row .bar i{display:block;height:100%;background:var(--series);border-radius:2px}
.row .n{flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--muted-foreground);min-width:34px;text-align:right}
.qbucket{margin:7px 0}
.qbucket .t{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;align-items:baseline}
.qbucket .t .pct{font-variant-numeric:tabular-nums;font-weight:600}
.qbucket .bar{height:4px;border-radius:2px;background:var(--muted);overflow:hidden}
.qbucket .bar i{display:block;height:100%;border-radius:2px}
.warn-ok{background:var(--green)} .warn-warn{background:var(--yellow)} .warn-hot{background:var(--red)}
.tag{display:inline-block;font-size:9px;border-radius:4px;padding:0 4px;margin-left:5px;line-height:1.6}
.tag.warn{color:var(--yellow);background:color-mix(in srgb, var(--yellow) 12%, transparent)}
.tag.hot{color:var(--red);background:color-mix(in srgb, var(--red) 12%, transparent)}
.mini{font-size:10px;color:var(--muted-foreground)}
.spark{width:100%;height:38px;display:block}
.spark rect{fill:var(--series);fill-opacity:.85}
.spark rect:hover{fill-opacity:1}
.sparklabel{display:flex;justify-content:space-between;font-size:9px;color:var(--muted-foreground);margin-top:2px}
.chips{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:8px}
.chips button{border:1px solid var(--border);background:none;color:var(--muted-foreground);font:inherit;font-size:10px;padding:2px 8px;border-radius:99px;cursor:pointer}
.chips button.on{background:var(--foreground);color:var(--background);border-color:var(--foreground)}
.chips input{font:inherit;font-size:10px;border:1px solid var(--border);border-radius:6px;background:var(--background);color:var(--foreground);padding:1px 4px;width:92px}
.hourbar{display:flex;align-items:flex-end;gap:1px;height:26px;margin-top:4px}
.hourbar i{flex:1;background:var(--series-2);opacity:.55;border-radius:1px 1px 0 0;min-height:1px}
.hourbar i.peak{opacity:1}
table{width:100%;border-collapse:collapse;font-size:10.5px}
table th{color:var(--muted-foreground);font-weight:500;text-align:left;padding:3px 4px;border-bottom:1px solid var(--border);white-space:nowrap}
table td{padding:3px 4px;border-bottom:1px dashed var(--border);font-variant-numeric:tabular-nums;white-space:nowrap}
table td.l{max-width:110px;overflow:hidden;text-overflow:ellipsis}
.st{font-size:9px;border-radius:4px;padding:0 4px}
.st0{color:var(--green)} .st1{color:var(--red)} .st2{color:var(--yellow)} .st3{color:var(--muted-foreground)}
.sess{display:flex;justify-content:space-between;gap:8px;font-size:11px;padding:5px 2px;border-bottom:1px dashed var(--border);cursor:pointer;border-radius:4px}
.sess:hover{background:var(--muted)}
.sess .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .n{font-variant-numeric:tabular-nums;color:var(--muted-foreground)}
.foot{display:flex;justify-content:space-between;margin-top:2px;font-size:10px;color:var(--muted-foreground)}
.sel{font:inherit;font-size:10px;border:1px solid var(--border);border-radius:6px;background:var(--background);color:var(--foreground);padding:2px 4px}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:10px;color:var(--muted-foreground)}
.det-card{border-left:2px solid var(--series);padding-left:8px;margin:8px 0}
.back{font-size:10px;color:var(--series);cursor:pointer;margin-bottom:6px;display:inline-block}
#ud-state{font-size:12px;color:var(--muted-foreground);padding:28px 0;text-align:center}
[hidden]{display:none !important}
</style>
</head>
<body>
<div id="ud-state">正在读取本地用量…</div>
<div id="ud-root" hidden>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <b style="font-size:12px">用量<span class="mini" id="ud-meta"></span></b>
    <span><button class="act" id="ud-open" type="button">完整面板 ↗</button> <button class="act" id="ud-refresh" type="button">刷新</button></span>
  </div>
  <div class="tabs" role="tablist">
    <button data-tab="overview" class="on" role="tab" type="button">总览</button>
    <button data-tab="trend" role="tab" type="button">趋势</button>
    <button data-tab="detail" role="tab" type="button">明细</button>
    <button data-tab="sessions" role="tab" type="button">会话</button>
  </div>

  <div id="tab-overview">
    <div class="card" id="ud-quota-card" hidden>
      <div class="hd"><b>套餐配额</b><span class="sub" id="ud-quota-src"></span></div>
      <div id="ud-quota"></div>
      <div class="mini" id="ud-quota-hint" hidden style="margin-top:6px"></div>
    </div>
    <div class="card">
      <div class="hd"><b>5 小时窗口</b><span class="sub" id="ud-win-eta"></span></div>
      <div class="qbucket"><div class="bar" style="height:4px"><i id="ud-win-fill" class="warn-ok" style="width:0%"></i></div></div>
      <div class="grid">
        <div class="kpi"><div class="v" id="ud-win-req">–</div><div class="l">窗口请求（本地口径）</div></div>
        <div class="kpi"><div class="v" id="ud-win-tok">–</div><div class="l">窗口 token</div></div>
      </div>
      <div class="mini" id="ud-win-est" style="margin-top:6px"></div>
    </div>
    <div class="card">
      <div class="hd"><b>总览</b><span class="sub" id="ud-kpi-sub"></span></div>
      <div class="grid">
        <div class="kpi"><div class="v" id="ud-req">–</div><div class="l">请求</div></div>
        <div class="kpi"><div class="v" id="ud-cr">–</div><div class="l">缓存命中率</div></div>
        <div class="kpi"><div class="v" id="ud-tok">–</div><div class="l">输入 token</div></div>
        <div class="kpi"><div class="v" id="ud-out">–</div><div class="l">生成 token</div></div>
      </div>
      <a class="more" href="#" id="ud-more-overview">分页明细 / 热力图 / 会话钻取 ↗</a>
    </div>
    <div class="card">
      <div class="hd"><b>时段分布</b><span class="sub" id="ud-peak"></span></div>
      <div class="hourbar" id="ud-hours"></div>
      <div class="sparklabel"><span>0 时</span><span>12 时</span><span>23 时</span></div>
    </div>
    <div class="card" id="ud-tools-card" hidden>
      <div class="hd"><b>常用工具</b><span class="sub">Top 5</span></div>
      <div id="ud-tools"></div>
    </div>
    <div class="foot"><span id="ud-health"></span><span id="ud-fail"></span></div>
  </div>

  <div id="tab-trend" hidden>
    <div class="card">
      <div class="chips" id="ud-range"></div>
      <div style="display:flex;gap:4px;align-items:center;margin-bottom:6px">
        <input type="date" id="ud-from"> <span class="mini">至</span> <input type="date" id="ud-to">
        <button class="act" id="ud-range-go" type="button">查</button>
      </div>
      <div class="grid" style="margin-bottom:4px">
        <div class="kpi"><div class="v" id="ud-t-req">–</div><div class="l">请求</div></div>
        <div class="kpi"><div class="v" id="ud-t-tok">–</div><div class="l">token 合计</div></div>
        <div class="kpi"><div class="v" id="ud-t-tps">–</div><div class="l">平均 tok/s</div></div>
        <div class="kpi"><div class="v" id="ud-t-cr">–</div><div class="l">缓存命中率</div></div>
      </div>
    </div>
    <div class="card">
      <div class="hd"><b>每日趋势</b><span class="sub" id="ud-daily-sub"></span></div>
      <svg class="spark" id="ud-daily" preserveAspectRatio="none" role="img" aria-label="每日趋势"></svg>
      <div class="sparklabel"><span id="ud-daily-a"></span><span id="ud-daily-b"></span></div>
    </div>
    <div class="card">
      <div class="hd"><b>来源构成</b><span class="sub">按 token</span></div>
      <div id="ud-pv"></div>
      <a class="more" href="#" id="ud-more-trend">按天表格 / 热力图 ↗</a>
    </div>
    <div class="card">
      <div class="hd"><b>模型分布</b><span class="sub">按 token</span></div>
      <div id="ud-md"></div>
    </div>
  </div>

  <div id="tab-detail" hidden>
    <div class="card">
      <div class="hd"><b>请求日志</b><span class="sub" id="ud-d-sub"></span></div>
      <div style="margin-bottom:6px">
        <select class="sel" id="ud-d-status">
          <option value="-1">全部状态</option>
          <option value="0">完成</option>
          <option value="1">失败</option>
          <option value="2">已取消</option>
          <option value="3">进行中</option>
        </select>
      </div>
      <div style="overflow-x:auto">
      <table>
        <thead><tr><th>时间</th><th>模型</th><th style="text-align:right">输入</th><th style="text-align:right">生成</th><th style="text-align:right">tok/s</th><th>状态</th><th>会话</th></tr></thead>
        <tbody id="ud-d-body"></tbody>
      </table>
      </div>
      <div class="pager">
        <button class="act" id="ud-d-prev" type="button">上一页</button>
        <span id="ud-d-page"></span>
        <button class="act" id="ud-d-next" type="button">下一页</button>
      </div>
      <a class="more" href="#" id="ud-more-detail">排序 / 筛选 / 逐条钻取 ↗</a>
    </div>
  </div>

  <div id="tab-sessions" hidden>
    <div class="card">
      <div class="hd"><b>会话</b><span class="sub" id="ud-s-sub">按 token Top 20</span></div>
      <div id="ud-s-list"></div>
      <a class="more" href="#" id="ud-more-sessions">完整排行 / 水位曲线 ↗</a>
    </div>
    <div id="ud-s-detail"></div>
  </div>
</div>
<script>
(function () {
  var zc = window.zcode;
  var fmtI = function (n) { return Number(n || 0).toLocaleString('en-US'); };
  var fmtC = function (n) {
    n = Number(n || 0);
    if (n >= 1e8) return (n / 1e8).toFixed(2) + ' 亿';
    if (n >= 1e4) return (n / 1e4).toFixed(1) + ' 万';
    return fmtI(n);
  };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(id) { return document.getElementById(id); }
  var tpsOf = function (outTok, dur, ttft) { var ms = Math.max(1, (dur || 0) - (ttft || 0)); return Math.round((outTok || 0) / ms * 1000); };
  function tpsHtml(t) {
    var c = t >= 320 ? 'var(--series-2)' : t >= 240 ? 'var(--red)' : t >= 160 ? 'var(--yellow)' : t >= 80 ? 'var(--green)' : 'var(--series)';
    return '<span style="color:' + c + '">' + fmtI(t) + '</span>';
  }
  var STN = ['完成', '失败', '已取消', '进行中'];
  var STC = ['st0', 'st1', 'st2', 'st3'];

  function applyTheme() {
    var t = (zc && zc.hostContext && zc.hostContext.theme) || null;
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  }
  function callTool(name, args) {
    return Promise.resolve(zc.callTool(name, args || {})).then(function (res) {
      var sc = res && (res.structuredContent || (res.result && res.result.structuredContent));
      if (!sc) throw new Error('空响应');
      return sc;
    });
  }
  function tab(name) {
    ['overview', 'trend', 'detail', 'sessions'].forEach(function (t) {
      $('tab-' + t).hidden = t !== name;
    });
    document.querySelectorAll('.tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === name); });
  }
  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      tab(b.dataset.tab);
      if (b.dataset.tab === 'trend') loadTrend();
      if (b.dataset.tab === 'detail') loadDetail();
      if (b.dataset.tab === 'sessions') loadSessions();
    });
  });
  function fullPanel(hash) {
    callTool('open_full_panel').then(function (r) {
      var url = (r && r.url || 'http://127.0.0.1:7741') + (hash ? '#' + hash : '');
      try { if (zc.openExternal) return void zc.openExternal({ href: url }); } catch (e) {}
      try { if (zc.openLink) return void zc.openLink({ url: url }); } catch (e) {}
      window.open(url, '_blank');
    }).catch(function (e) { $('ud-state').textContent = '打开失败：' + (e && e.message || e); });
  }
  $('ud-open').addEventListener('click', function () { fullPanel(''); });
  [['ud-more-overview', ''], ['ud-more-trend', 'trend'], ['ud-more-detail', 'detail'], ['ud-more-sessions', 'sessions']].forEach(function (p) {
    $(p[0]).addEventListener('click', function (e) { e.preventDefault(); fullPanel(p[1]); });
  });

  function bars(el, items) {
    if (!items || !items.length) { el.innerHTML = '<div class="mini">暂无数据</div>'; return; }
    el.innerHTML = items.map(function (it) {
      return '<div class="row"><span class="nm" title="' + esc(it.name) + '">' + esc(it.name) + '</span>' +
        '<span class="bar"><i style="width:' + Math.max(2, it.pct) + '%"></i></span>' +
        '<span class="n">' + it.pct + '%</span></div>';
    }).join('');
  }
  function warnClass(p) { return p >= 80 ? 'warn-hot' : (p >= 60 ? 'warn-warn' : 'warn-ok'); }

  // ---- 总览 ----
  function renderOverview(d) {
    $('ud-meta').textContent = ' · ' + (d.kpi.gen || '');
    var k = d.kpi || {};
    var qc = $('ud-quota-card');
    var hasBuckets = d.quota && d.quota.buckets && d.quota.buckets.length;
    qc.hidden = !hasBuckets && !(d.quotaHint);
    if (hasBuckets) {
      $('ud-quota-src').textContent = '客户端日志' + (d.quota.stale ? '（' + d.quota.logDate + ' 观测）' : '');
      $('ud-quota').innerHTML = d.quota.buckets.map(function (b) {
        var reset = b.resetAt ? '<span class="mini">' + esc(new Date(b.resetAt).toLocaleString()) + ' 重置</span>' : '';
        var tag = b.percent >= 80 ? '<span class="tag hot">即将用尽</span>' : b.percent >= 60 ? '<span class="tag warn">用量偏高</span>' : '';
        return '<div class="qbucket"><div class="t"><span>' + esc(b.name) + tag + reset + '</span><span class="pct">' + b.percent + '%</span></div>' +
          '<div class="bar"><i class="' + warnClass(b.percent) + '" style="width:' + Math.min(100, b.percent) + '%"></i></div>' +
          '<div class="mini">已用 ' + fmtI(b.used) + ' / ' + fmtI(b.limit) + (b.remaining != null ? ' · 余 ' + fmtI(b.remaining) : '') + '</div></div>';
      }).join('');
    }
    var hint = $('ud-quota-hint');
    if (d.quotaHint) { hint.hidden = false; hint.innerHTML = d.quotaHint; } else hint.hidden = true;
    // 5h 窗口
    var w = d.window || {};
    $('ud-win-req').textContent = fmtI(w.req);
    $('ud-win-tok').textContent = fmtC(w.tok);
    if (w.start) {
      var el = Date.now() - w.start;
      var usedPct = Math.min(100, Math.round(el / 18e6 * 100));
      var left = Math.max(0, 18e6 - el);
      $('ud-win-eta').textContent = (left > 0 ? '剩余 ' + (left / 36e5).toFixed(1) + ' h' : '已满 5h');
      var f = $('ud-win-fill');
      f.style.width = usedPct + '%';
      f.className = warnClass(usedPct);
    } else { $('ud-win-eta').textContent = '暂无进行中的窗口'; $('ud-win-fill').style.width = '0%'; }
    var est = d.windowEstimate;
    $('ud-win-est').textContent = est && est.avgReq
      ? '近 ' + est.basedOn + ' 个完整窗口均值 ' + fmtI(est.avgReq) + ' 次 · 本窗口预计还可约 ' + fmtI(est.remainingReq) + ' 次'
      : '';
    $('ud-req').innerHTML = fmtI(k.requests) + (d.failures ? '<span class="badge" style="color:var(--red)">' + fmtI(d.failures) + ' 失败</span>' : '');
    $('ud-kpi-sub').textContent = '已加载 ' + fmtI(k.covered) + ' / ' + fmtI(k.total) + ' · 今日 ' + fmtI(k.todayRequests) + ' 次';
    $('ud-cr').textContent = k.cacheRate == null ? '–' : k.cacheRate + '%';
    $('ud-tok').textContent = fmtC(k.inTokens);
    $('ud-out').textContent = fmtC(k.outTokens);
    renderHours(d.hours);
    if (d.tools && d.tools.length) {
      $('ud-tools-card').hidden = false;
      $('ud-tools').innerHTML = d.tools.map(function (t) {
        return '<div class="row"><span class="nm" title="' + esc(t.name) + '">' + esc(t.name) + '</span><span class="n" style="min-width:0">×' + fmtI(t.req) + '</span></div>';
      }).join('');
    }
    var dk = d.disk || {};
    $('ud-health').textContent = (dk.logs ? '日志 ' + fmtI(dk.logs) + 'MB · ' : '') + (dk.db ? '库 ' + fmtI(dk.db) + 'MB' : '');
    $('ud-fail').textContent = (d.states && (d.states.error || d.states.cancelled)) ? '失败 ' + fmtI(d.states.error) + ' · 取消 ' + fmtI(d.states.cancelled) : '';
  }
  function renderHours(hours) {
    var el = $('ud-hours');
    if (!hours || !hours.length) { el.innerHTML = ''; $('ud-peak').textContent = '暂无数据'; return; }
    var map = {};
    hours.forEach(function (h) { map[h.h] = h.req; });
    var max = 1, peak = 0, peakN = 0;
    for (var i = 0; i < 24; i++) { if ((map[i] || 0) > max) { max = map[i]; peak = i; peakN = map[i]; } }
    el.innerHTML = Array.apply(null, Array(24)).map(function (_, i) {
      var v = map[i] || 0;
      return '<i class="' + (v === max && v > 0 ? 'peak' : '') + '" style="height:' + Math.max(4, v / max * 100) + '%" title="' + i + ':00–' + i + ':59 · ' + fmtI(v) + ' 次"></i>';
    }).join('');
    $('ud-peak').textContent = '峰值 ' + peak + ' 时 · ' + fmtI(peakN) + ' 次';
  }

  // ---- 趋势 ----
  var RANGES = [['today', '今天'], ['yesterday', '昨天'], ['7d', '7 天'], ['30d', '30 天'], ['month', '本月'], ['last_month', '上月'], ['all', '全部']];
  var curRange = '7d';
  function renderRangeChips() {
    $('ud-range').innerHTML = RANGES.map(function (r) {
      return '<button data-r="' + r[0] + '" class="' + (curRange === r[0] ? 'on' : '') + '" type="button">' + r[1] + '</button>';
    }).join('');
    Array.prototype.forEach.call($('ud-range').querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () { curRange = b.dataset.r; $('ud-from').value = ''; $('ud-to').value = ''; renderRangeChips(); loadTrend(); });
    });
  }
  function renderDaily(daily) {
    var svg = $('ud-daily');
    if (!daily || !daily.length) { svg.innerHTML = ''; $('ud-daily-a').textContent = '暂无数据'; $('ud-daily-b').textContent = ''; return; }
    var W = 300, H = 38, max = 1;
    daily.forEach(function (d) { if (d.tokens > max) max = d.tokens; });
    var bw = W / daily.length;
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.innerHTML = daily.map(function (d, i) {
      var h = Math.max(1.5, d.tokens / max * (H - 4));
      return '<rect x="' + (i * bw + 0.5).toFixed(1) + '" y="' + (H - h).toFixed(1) + '" width="' + Math.max(1, bw - 1.5).toFixed(1) + '" height="' + h.toFixed(1) + '"><title>' + esc(d.day) + ' · ' + fmtC(d.tokens) + ' tok</title></rect>';
    }).join('');
    $('ud-daily-a').textContent = daily[0].day;
    $('ud-daily-b').textContent = daily[daily.length - 1].day + ' · 峰 ' + fmtC(max);
  }
  function loadTrend() {
    var a = { range: curRange };
    if ($('ud-from').value && $('ud-to').value) { a = { from: $('ud-from').value, to: $('ud-to').value }; }
    callTool('usage_trend', a).then(function (t) {
      var k = t.kpi || {};
      $('ud-t-req').textContent = fmtI(k.requests);
      $('ud-t-tok').textContent = fmtC((k.inTokens || 0) + (k.outTokens || 0));
      $('ud-t-tps').textContent = k.avgTps == null ? '–' : k.avgTps;
      $('ud-t-cr').textContent = k.cacheRate == null ? '–' : k.cacheRate + '%';
      $('ud-daily-sub').textContent = (t.from && t.to ? t.from + ' ~ ' + t.to : '');
      renderDaily(t.daily);
      bars($('ud-pv'), t.providers);
      bars($('ud-md'), t.models);
    }).catch(function (e) { $('ud-state').textContent = '趋势读取失败：' + (e && e.message || e); });
  }
  $('ud-range-go').addEventListener('click', loadTrend);
  renderRangeChips();

  // ---- 明细 ----
  var dPage = 0, dStatus = -1, dPageSize = 50;
  function loadDetail() {
    callTool('usage_detail', { limit: dPageSize, offset: dPage * dPageSize, status: dStatus < 0 ? undefined : dStatus }).then(function (r) {
      var rows = r.rows || [];
      $('ud-d-body').innerHTML = rows.length ? rows.map(function (r) {
        var tps = r[7] ? tpsOf(r[4], r[7], r[8]) : 0;
        return '<tr><td>' + esc(String(r[0]).slice(5, 16)) + '</td><td class="l" title="' + esc(r[1]) + '">' + esc(r[1]) + '</td>' +
          '<td style="text-align:right">' + fmtC(r[3]) + '</td><td style="text-align:right">' + fmtC(r[4]) + '</td>' +
          '<td style="text-align:right">' + tpsHtml(tps) + '</td><td><span class="st' + r[9] + '">' + STN[r[9]] + '</span></td>' +
          '<td class="l" title="' + esc(r[10]) + '">' + esc(r[10]) + '</td></tr>';
      }).join('') : '<tr><td colspan="7" class="mini">当前筛选下暂无数据</td></tr>';
      $('ud-d-page').textContent = '第 ' + (dPage + 1) + ' 页';
      $('ud-d-prev').disabled = dPage === 0;
      $('ud-d-next').disabled = rows.length < dPageSize;
      $('ud-d-sub').textContent = dStatus >= 0 ? '状态筛选：' + STN[dStatus] : '';
    }).catch(function (e) { $('ud-state').textContent = '明细读取失败：' + (e && e.message || e); });
  }
  $('ud-d-prev').addEventListener('click', function () { if (dPage > 0) { dPage--; loadDetail(); } });
  $('ud-d-next').addEventListener('click', function () { dPage++; loadDetail(); });
  $('ud-d-status').addEventListener('change', function () { dStatus = +this.value; dPage = 0; loadDetail(); });

  // ---- 会话 ----
  function loadSessions() {
    callTool('usage_sessions', { range: 'all' }).then(function (r) {
      var list = r.sessions || [];
      $('ud-s-list').innerHTML = list.length ? list.map(function (s, i) {
        return '<div class="sess" data-i="' + i + '"><span class="t" title="' + esc(s.title) + '">' + esc(s.title) + '</span>' +
          '<span class="n">' + fmtC(s.tokens) + ' · ' + fmtI(s.req) + ' 次</span></div>';
      }).join('') : '<div class="mini">暂无数据</div>';
      Array.prototype.forEach.call($('ud-s-list').querySelectorAll('.sess'), function (el) {
        el.addEventListener('click', function () {
          var s = list[+el.dataset.i];
          openSession(s.id, s.title);
        });
      });
    }).catch(function (e) { $('ud-state').textContent = '会话读取失败：' + (e && e.message || e); });
  }
  function openSession(id, title) {
    $('ud-s-detail').innerHTML = '<div class="mini" style="padding:10px 0">加载会话详情…</div>';
    callTool('usage_session', { id: id }).then(function (sd) {
      if (sd.error) { $('ud-s-detail').innerHTML = '<div class="mini">' + esc(sd.error) + '</div>'; return; }
      var mm = (sd.models || []).map(function (m) { var tot = sd.inTokens + sd.outTokens || 1; return '<span class="mini">' + esc(m.name) + ' ' + Math.round(m.tokens / tot * 100) + '%</span>'; }).join(' · ');
      var pv = (sd.providers || []).map(function (p) { return '<span class="mini">' + esc(p.name) + ' ×' + fmtI(p.req) + '</span>'; }).join(' · ');
      var tl = (sd.tools || []).map(function (t) { return '<span class="mini">' + esc(String(t.name).replace(/^mcp__/, '')) + ' ×' + fmtI(t.req) + '</span>'; }).join(' · ');
      $('ud-s-detail').innerHTML =
        '<div class="card det-card"><span class="back" id="ud-s-back">← 返回会话列表</span>' +
        '<div style="font-weight:600;margin-bottom:4px">' + esc(sd.title) + '</div>' +
        '<div class="mini" style="margin-bottom:6px">' + esc(String(sd.dir || '–')) + '</div>' +
        '<div class="grid">' +
        '<div class="kpi"><div class="v">' + fmtI(sd.requests) + '</div><div class="l">请求' + (sd.errors ? '（失败 ' + sd.errors + '）' : '') + '</div></div>' +
        '<div class="kpi"><div class="v">' + (sd.cacheRate == null ? '–' : sd.cacheRate + '%') + '</div><div class="l">缓存命中率</div></div>' +
        '<div class="kpi"><div class="v">' + fmtC(sd.inTokens) + '</div><div class="l">输入 token</div></div>' +
        '<div class="kpi"><div class="v">' + (sd.avgTps == null ? '–' : sd.avgTps) + '</div><div class="l">平均 tok/s（加权）</div></div>' +
        '</div>' +
        (sd.compactions ? '<div class="mini" style="margin-top:6px">上下文压缩 ' + sd.compactions.cnt + ' 次 · 压缩前水位最高 ' + fmtC(sd.compactions.pre) + ' tok</div>' : '<div class="mini" style="margin-top:6px">无压缩记录</div>') +
        '<div style="margin-top:6px">模型占比：' + mm + '</div>' +
        '<div style="margin-top:2px">来源：' + pv + '</div>' +
        (tl ? '<div style="margin-top:2px">工具：' + tl + '</div>' : '') +
        '<div style="margin-top:8px"><b style="font-size:11px">最近请求</b></div>' +
        '<table><tbody>' + (sd.recent || []).map(function (r) {
          var tps = r.dur ? tpsOf(r.outTok, r.dur, r.ttft) : 0;
          return '<tr><td>' + esc(String(r.t).slice(5, 16)) + '</td><td class="l" title="' + esc(r.model) + '">' + esc(r.model) + '</td><td style="text-align:right">' + fmtC(r.inTok) + '</td><td style="text-align:right">' + fmtC(r.outTok) + '</td><td style="text-align:right">' + tpsHtml(tps) + '</td><td><span class="st' + r.status + '">' + STN[r.status] + '</span></td></tr>';
        }).join('') + '</tbody></table>' +
        '</div>';
      $('ud-s-back').addEventListener('click', function () { $('ud-s-detail').innerHTML = ''; });
      $('ud-s-detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }).catch(function (e) { $('ud-s-detail').innerHTML = '<div class="mini">详情读取失败：' + esc(String(e && e.message || e)) + '</div>'; });
  }

  function load() {
    if (!zc || !zc.callTool) {
      $('ud-state').textContent = '面板需要在 ZCode Desktop 会话内打开（未检测到 window.zcode 桥）';
      return;
    }
    callTool('usage_summary').then(function (d) {
      $('ud-state').hidden = true;
      $('ud-root').hidden = false;
      renderOverview(d);
    }).catch(function (e) {
      $('ud-state').textContent = '读取失败：' + (e && e.message || e);
    });
  }
  $('ud-refresh').addEventListener('click', load);
  if (zc && zc.subscribe) { try { zc.subscribe(function () { applyTheme(); }); } catch (e) {} }
  applyTheme();
  function boot() { applyTheme(); load(); }
  if (zc && zc.ready) { Promise.resolve(zc.ready()).then(boot).catch(boot); } else { boot(); }
  setInterval(load, 60000);
})();
</script>
</body>
</html>
