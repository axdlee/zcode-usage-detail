<!doctype html>
<!-- ZCode 用量明细 · 会话侧栏面板。零依赖：经宿主注入的 window.zcode 兼容层取数，明暗主题自适应 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>用量面板</title>
<style>
:root{
  --background:#ffffff; --foreground:#1a1a1a; --card:#ffffff;
  --muted:#f4f4f5; --muted-foreground:#71717a; --border:#e4e4e7;
  --green:#16a34a; --red:#dc2626; --yellow:#d97706; --series:#4066f0; --series-2:#e8890c;
}
@media (prefers-color-scheme: dark){
  :root{
    --background:#1b1b1f; --foreground:#e9e9ec; --card:#232328;
    --muted:#2c2c31; --muted-foreground:#9c9ca6; --border:#38383f;
    --green:#3fbf7f; --red:#f47166; --yellow:#d9a514; --series:#6c8cff; --series-2:#e8a15c;
  }
}
:root[data-theme="dark"]{--background:#1b1b1f;--foreground:#e9e9ec;--card:#232328;--muted:#2c2c31;--muted-foreground:#9c9ca6;--border:#38383f;--green:#3fbf7f;--red:#f47166;--yellow:#d9a514;--series:#6c8cff;--series-2:#e8a15c}
:root[data-theme="light"]{--background:#ffffff;--foreground:#1a1a1a;--card:#ffffff;--muted:#f4f4f5;--muted-foreground:#71717a;--border:#e4e4e7;--green:#16a34a;--red:#dc2626;--yellow:#d97706;--series:#4066f0;--series-2:#e8890c}
*{box-sizing:border-box}
body{margin:0;padding:10px 10px 18px;background:var(--background);color:var(--foreground);font:12px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.card{border:1px solid var(--border);border-radius:10px;padding:10px 11px;margin:0 0 8px;background:var(--card)}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hd b{font-size:12px;font-weight:600;letter-spacing:.2px}
.hd .sub{font-size:10px;color:var(--muted-foreground);font-weight:400;margin-left:6px}
.act{font-size:11px;color:var(--muted-foreground);cursor:pointer;border:1px solid var(--border);background:none;padding:2px 8px;border-radius:6px;line-height:1.5}
.act:hover{color:var(--foreground);border-color:var(--muted-foreground)}
.act.primary{color:var(--background);background:var(--foreground);border-color:var(--foreground)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kpi .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.kpi .l{font-size:10px;color:var(--muted-foreground);margin-top:1px}
.kpi .badge{display:inline-block;font-size:9px;padding:0 4px;border-radius:4px;margin-left:4px;vertical-align:2px}
.row{display:flex;align-items:center;gap:7px;margin:4px 0;font-size:11px}
.row .nm{flex:0 0 36%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted-foreground)}
.row .bar{flex:1;height:4px;border-radius:2px;background:var(--muted);overflow:hidden}
.row .bar i{display:block;height:100%;background:var(--series);border-radius:2px}
.row .n{flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--muted-foreground);min-width:34px;text-align:right}
.qbucket{margin:7px 0}
.qbucket .t{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;align-items:baseline}
.qbucket .t .pct{font-variant-numeric:tabular-nums;font-weight:600}
.qbucket .bar{height:4px;border-radius:2px;background:var(--muted);overflow:hidden}
.qbucket .bar i{display:block;height:100%;border-radius:2px}
.warn-ok{background:var(--green)} .warn-warn{background:var(--yellow)} .warn-hot{background:var(--red)}
.tag{display:inline-block;font-size:9px;border-radius:4px;padding:0 4px;margin-left:5px;line-height:1.6}
.tag.warn{color:var(--yellow);background:color-mix(in srgb, var(--yellow) 12%, transparent)}
.tag.hot{color:var(--red);background:color-mix(in srgb, var(--red) 12%, transparent)}
.mini{font-size:10px;color:var(--muted-foreground)}
.spark{width:100%;height:38px;display:block}
.spark rect{fill:var(--series);fill-opacity:.85;rx:1.5}
.spark rect:hover{fill-opacity:1}
.sparklabel{display:flex;justify-content:space-between;font-size:9px;color:var(--muted-foreground);margin-top:2px}
.hourbar{display:flex;align-items:flex-end;gap:1px;height:26px;margin-top:4px}
.hourbar i{flex:1;background:var(--series-2);opacity:.55;border-radius:1px 1px 0 0;min-height:1px}
.hourbar i.peak{opacity:1}
.sess{display:flex;justify-content:space-between;gap:8px;font-size:11px;padding:4px 0;border-bottom:1px dashed var(--border)}
.sess:last-child{border-bottom:0}
.sess .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .n{font-variant-numeric:tabular-nums;color:var(--muted-foreground)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:2px;font-size:10px;color:var(--muted-foreground)}
#ud-state{font-size:12px;color:var(--muted-foreground);padding:28px 0;text-align:center}
.winbar{height:5px;border-radius:3px;background:var(--muted);overflow:hidden;margin:7px 0 4px}
.winbar i{display:block;height:100%;border-radius:3px;background:var(--series)}
.skeleton{position:relative;overflow:hidden;background:var(--muted);border-radius:8px;height:52px;margin-bottom:8px}
.skeleton::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--foreground) 6%,transparent),transparent);animation:ud-sh 1.4s infinite}
@keyframes ud-sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
</style>
</head>
<body>
<div id="ud-state">正在读取本地用量…</div>
<div id="ud-root" hidden>
  <div class="card">
    <div class="hd" style="margin-bottom:0"><b>用量<span class="sub" id="ud-meta"></span></b>
      <span><button class="act" id="ud-open" type="button">完整面板 ↗</button> <button class="act" id="ud-refresh" type="button">刷新</button></span>
    </div>
  </div>
  <div class="card" id="ud-quota-card" hidden>
    <div class="hd"><b>套餐配额</b><span class="sub" id="ud-quota-src"></span></div>
    <div id="ud-quota"></div>
  </div>
  <div class="card">
    <div class="hd"><b>5 小时窗口</b><span class="sub" id="ud-win-eta"></span></div>
    <div class="winbar"><i id="ud-win-fill" style="width:0%"></i></div>
    <div class="grid">
      <div class="kpi"><div class="v" id="ud-win-req">–</div><div class="l">窗口请求</div></div>
      <div class="kpi"><div class="v" id="ud-win-tok">–</div><div class="l">窗口 token</div></div>
    </div>
    <div class="mini" id="ud-win-est" style="margin-top:6px"></div>
  </div>
  <div class="card">
    <div class="hd"><b>总览</b><span class="sub" id="ud-kpi-sub"></span></div>
    <div class="grid">
      <div class="kpi"><div class="v" id="ud-req">–</div><div class="l">请求</div></div>
      <div class="kpi"><div class="v" id="ud-cr">–</div><div class="l">缓存命中率</div></div>
      <div class="kpi"><div class="v" id="ud-tok">–</div><div class="l">输入 token</div></div>
      <div class="kpi"><div class="v" id="ud-out">–</div><div class="l">生成 token</div></div>
    </div>
  </div>
  <div class="card">
    <div class="hd"><b>每日趋势</b><span class="sub">近 14 天 · token</span></div>
    <svg class="spark" id="ud-daily" preserveAspectRatio="none" role="img" aria-label="每日趋势"></svg>
    <div class="sparklabel"><span id="ud-daily-a"></span><span id="ud-daily-b"></span></div>
  </div>
  <div class="card">
    <div class="hd"><b>时段分布</b><span class="sub" id="ud-peak"></span></div>
    <div class="hourbar" id="ud-hours"></div>
    <div class="sparklabel"><span>0 时</span><span>12 时</span><span>23 时</span></div>
  </div>
  <div class="card">
    <div class="hd"><b>来源构成</b><span class="sub">按 token</span></div>
    <div id="ud-pv"></div>
  </div>
  <div class="card">
    <div class="hd"><b>模型分布</b><span class="sub">按 token</span></div>
    <div id="ud-md"></div>
  </div>
  <div class="card" id="ud-tools-card" hidden>
    <div class="hd"><b>常用工具</b><span class="sub">Top 5</span></div>
    <div id="ud-tools"></div>
  </div>
  <div class="card">
    <div class="hd"><b>最近活跃会话</b><span class="sub">Top 5</span></div>
    <div id="ud-sess"></div>
  </div>
  <div class="foot"><span id="ud-health"></span><span id="ud-fail"></span></div>
</div>
<script>
(function () {
  var zc = window.zcode;
  var fmtI = function (n) { return Number(n || 0).toLocaleString('en-US'); };
  var fmtC = function (n) {
    n = Number(n || 0);
    if (n >= 1e8) return (n / 1e8).toFixed(2) + ' 亿';
    if (n >= 1e4) return (n / 1e4).toFixed(1) + ' 万';
    return fmtI(n);
  };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(id) { return document.getElementById(id); }

  function applyTheme() {
    var t = (zc && zc.hostContext && zc.hostContext.theme) || null;
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  }

  function bars(el, items) {
    if (!items || !items.length) { el.innerHTML = '<div class="mini">暂无数据</div>'; return; }
    el.innerHTML = items.map(function (it) {
      return '<div class="row"><span class="nm" title="' + esc(it.name) + '">' + esc(it.name) + '</span>' +
        '<span class="bar"><i style="width:' + Math.max(2, it.pct) + '%"></i></span>' +
        '<span class="n">' + it.pct + '%</span></div>';
    }).join('');
  }

  function warnClass(p) { return p >= 80 ? 'warn-hot' : (p >= 60 ? 'warn-warn' : 'warn-ok'); }

  function renderDaily(daily) {
    var svg = $('ud-daily');
    if (!daily || !daily.length) { svg.innerHTML = ''; $('ud-daily-a').textContent = '暂无数据'; $('ud-daily-b').textContent = ''; return; }
    var W = 300, H = 38, max = 1;
    daily.forEach(function (d) { if (d.tokens > max) max = d.tokens; });
    var bw = W / daily.length;
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.innerHTML = daily.map(function (d, i) {
      var h = Math.max(1.5, d.tokens / max * (H - 4));
      return '<rect x="' + (i * bw + 0.5).toFixed(1) + '" y="' + (H - h).toFixed(1) + '" width="' + Math.max(1, bw - 1.5).toFixed(1) + '" height="' + h.toFixed(1) + '"><title>' + esc(d.day) + ' · ' + fmtC(d.tokens) + ' tok</title></rect>';
    }).join('');
    $('ud-daily-a').textContent = daily[0].day;
    $('ud-daily-b').textContent = daily[daily.length - 1].day + ' · 峰 ' + fmtC(max);
  }

  function renderHours(hours) {
    var el = $('ud-hours');
    if (!hours || !hours.length) { el.innerHTML = ''; $('ud-peak').textContent = '暂无数据'; return; }
    var map = {};
    hours.forEach(function (h) { map[h.h] = h.req; });
    var max = 1, peak = 0, peakN = 0;
    for (var i = 0; i < 24; i++) { if ((map[i] || 0) > max) { max = map[i]; peak = i; peakN = map[i]; } }
    el.innerHTML = Array.apply(null, Array(24)).map(function (_, i) {
      var v = map[i] || 0;
      return '<i class="' + (v === max && v > 0 ? 'peak' : '') + '" style="height:' + Math.max(4, v / max * 100) + '%" title="' + i + ':00–' + i + ':59 · ' + fmtI(v) + ' 次请求"></i>';
    }).join('');
    $('ud-peak').textContent = '峰值 ' + peak + ' 时 · ' + fmtI(peakN) + ' 次';
  }

  function render(d) {
    $('ud-state').hidden = true;
    $('ud-root').hidden = false;
    var k = d.kpi || {};
    $('ud-meta').textContent = '快照 ' + (k.gen || '');
    // KPI
    var failNote = d.failures ? '<span class="badge" style="color:var(--red)">' + fmtI(d.failures) + ' 失败</span>' : '';
    $('ud-req').innerHTML = fmtI(k.requests) + failNote;
    $('ud-kpi-sub').textContent = '已加载 ' + fmtI(k.covered) + ' / ' + fmtI(k.total) + ' · 今日 ' + fmtI(k.todayRequests) + ' 次';
    $('ud-cr').textContent = k.cacheRate == null ? '–' : k.cacheRate + '%';
    $('ud-tok').textContent = fmtC(k.inTokens);
    $('ud-out').textContent = fmtC(k.outTokens);
    // 配额
    var qc = $('ud-quota-card');
    if (d.quota && d.quota.buckets && d.quota.buckets.length) {
      qc.hidden = false;
      $('ud-quota-src').textContent = '客户端日志' + (d.quota.stale ? '（' + d.quota.logDate + ' 观测）' : '');
      $('ud-quota').innerHTML = d.quota.buckets.map(function (b) {
        var reset = b.resetAt ? '<span class="mini">' + esc(new Date(b.resetAt).toLocaleString()) + ' 重置</span>' : '';
        var tag = b.percent >= 80 ? '<span class="tag hot">即将用尽</span>' : b.percent >= 60 ? '<span class="tag warn">用量偏高</span>' : '';
        return '<div class="qbucket"><div class="t"><span>' + esc(b.name) + tag + reset + '</span><span class="pct">' + b.percent + '%</span></div>' +
          '<div class="bar"><i class="' + warnClass(b.percent) + '" style="width:' + Math.min(100, b.percent) + '%"></i></div>' +
          '<div class="mini">已用 ' + fmtI(b.used) + ' / ' + fmtI(b.limit) + (b.remaining != null ? ' · 余 ' + fmtI(b.remaining) : '') + '</div></div>';
      }).join('');
    } else qc.hidden = true;
    // 5h 窗口
    var w = d.window || {};
    $('ud-win-req').textContent = fmtI(w.req);
    $('ud-win-tok').textContent = fmtC(w.tok);
    if (w.start) {
      var el = Date.now() - w.start;
      var usedPct = Math.min(100, Math.round(el / 1800000 / 60 * 10) / 10);
      usedPct = Math.min(100, Math.round(el / 18e6 * 100));
      var left = Math.max(0, 18e6 - el);
      $('ud-win-eta').textContent = (left > 0 ? '剩余 ' + (left / 36e5).toFixed(1) + ' h' : '已满 5h');
      $('ud-win-fill').style.width = usedPct + '%';
    } else { $('ud-win-eta').textContent = '暂无进行中的窗口'; $('ud-win-fill').style.width = '0%'; }
    var est = d.windowEstimate;
    $('ud-win-est').textContent = est && est.avgReq
      ? '近 ' + est.basedOn + ' 个完整窗口均值 ' + fmtI(est.avgReq) + ' 次 · 本窗口预计还可约 ' + fmtI(est.remainingReq) + ' 次'
      : '';
    bars($('ud-pv'), d.providers);
    bars($('ud-md'), d.models);
    renderDaily(d.daily);
    renderHours(d.hours);
    // 工具
    if (d.tools && d.tools.length) {
      $('ud-tools-card').hidden = false;
      $('ud-tools').innerHTML = d.tools.map(function (t) {
        return '<div class="row"><span class="nm" title="' + esc(t.name) + '">' + esc(t.name) + '</span><span class="n" style="min-width:0">×' + fmtI(t.req) + '</span></div>';
      }).join('');
    }
    var se = $('ud-sess');
    if (!d.topSessions || !d.topSessions.length) se.innerHTML = '<div class="mini">暂无数据</div>';
    else se.innerHTML = d.topSessions.map(function (s) {
      return '<div class="sess"><span class="t" title="' + esc(s.title) + '">' + esc(s.title) + '</span><span class="n">' + fmtC(s.tokens) + '</span></div>';
    }).join('');
    var dk = d.disk || {};
    $('ud-health').textContent = (dk.logs ? '日志 ' + fmtI(dk.logs) + 'MB · ' : '') + (dk.db ? '库 ' + fmtI(dk.db) + 'MB' : '');
    $('ud-fail').textContent = (d.states && (d.states.error || d.states.cancelled)) ? '失败 ' + fmtI(d.states.error) + ' · 取消 ' + fmtI(d.states.cancelled) : '';
  }

  function callTool(name, args) {
    return Promise.resolve(zc.callTool(name, args || {})).then(function (res) {
      var sc = res && (res.structuredContent || (res.result && res.result.structuredContent));
      if (!sc) throw new Error('空响应');
      return sc;
    });
  }

  function load() {
    if (!zc || !zc.callTool) {
      $('ud-state').textContent = '面板需要在 ZCode Desktop 会话内打开（未检测到 window.zcode 桥）';
      return;
    }
    callTool('usage_summary').then(render).catch(function (e) {
      $('ud-state').textContent = '读取失败：' + (e && e.message || e);
    });
  }
  $('ud-refresh').addEventListener('click', load);
  $('ud-open').addEventListener('click', function () {
    callTool('open_full_panel').then(function (r) {
      var url = r && r.url;
      if (!url) return;
      try { if (zc.openExternal) return void zc.openExternal({ href: url }); } catch (e) {}
      try { if (zc.openLink) return void zc.openLink({ url: url }); } catch (e) {}
      window.open(url, '_blank');
    }).catch(function (e) { $('ud-state').textContent = '打开失败：' + (e && e.message || e); });
  });
  if (zc && zc.subscribe) { try { zc.subscribe(function () { applyTheme(); }); } catch (e) {} }
  applyTheme();
  function boot() { applyTheme(); load(); }
  if (zc && zc.ready) { Promise.resolve(zc.ready()).then(boot).catch(boot); } else { boot(); }
  setInterval(load, 60000);
})();
</script>
</body>
</html>
